# Production login requires a dedicated GitHub OAuth provider. Local editing works
# immediately with `npx decap-server` alongside `npm run dev`.
backend:
  name: github
  repo: GrumpyGeorgie/alpha-sports-med-website
  branch: main
  base_url: https://alpha-sports-med-prototype.pages.dev
  auth_endpoint: api/auth
  site_domain: alpha-sports-med-prototype.pages.dev

local_backend: true
site_url: https://alpha-sports-med-prototype.pages.dev
display_url: https://alpha-sports-med-prototype.pages.dev
logo_url: /assets/images/alpha-logo-lockup.webp

media_folder: public/assets/images/uploads
public_folder: /assets/images/uploads

collections:
  - label: Core pages — Homepage
    name: homepage
    files:
      - label: Homepage settings
        name: home
        file: src/data/home.json
        format: json
        fields:
          - label: SEO
            name: seo
            widget: object
            fields:
              - { label: Page title, name: title, widget: string }
              - { label: Meta description, name: description, widget: text }
          - label: Site details
            name: site
            widget: object
            fields:
              - { label: Phone number, name: phoneDisplay, widget: string }
              - { label: Phone link, name: phoneHref, widget: string }
              - { label: Booking URL, name: bookingUrl, widget: string }
          - label: Hero
            name: hero
            widget: object
            fields:
              - { label: Eyebrow, name: eyebrow, widget: string }
              - { label: Heading, name: heading, widget: string }
              - { label: Supporting copy, name: subheading, widget: text }
              - { label: Image, name: image, widget: image }
              - { label: Image alt text, name: imageAlt, widget: string }
              - { label: Caption name, name: captionName, widget: string }
              - { label: Caption title, name: captionTitle, widget: string }
          - label: Closing call to action
            name: closing
            widget: object
            fields:
              - { label: Eyebrow, name: eyebrow, widget: string }
              - { label: Heading, name: heading, widget: string }
              - { label: Copy, name: copy, widget: text }
  - label: Core pages — About
    name: about_page
    files:
      - label: About page settings
        name: about
        file: src/data/about.json
        format: json
        fields:
          - label: SEO
            name: seo
            widget: object
            fields:
              - { label: Page title, name: title, widget: string }
              - { label: Meta description, name: description, widget: text }
          - label: Hero
            name: hero
            widget: object
            fields:
              - { label: Eyebrow, name: eyebrow, widget: string }
              - { label: Heading, name: heading, widget: string }
              - { label: Supporting copy, name: subheading, widget: text }
          - label: Overview
            name: overview
            widget: object
            fields:
              - { label: Eyebrow, name: eyebrow, widget: string }
              - { label: Heading, name: heading, widget: string }
              - label: Paragraphs
                name: paragraphs
                widget: list
                field: { label: Paragraph, name: paragraph, widget: text }
          - label: Values
            name: values
            widget: list
            fields:
              - { label: Icon class, name: icon, widget: string }
              - { label: Title, name: title, widget: string }
              - { label: Copy, name: copy, widget: text }
          - label: Care approach
            name: approach
            widget: list
            fields:
              - { label: Number, name: number, widget: string }
              - { label: Title, name: title, widget: string }
              - { label: Copy, name: copy, widget: text }
          - label: Leadership
            name: leadership
            widget: object
            fields:
              - { label: Heading, name: heading, widget: string }
              - { label: Copy, name: copy, widget: text }
          - label: Closing call to action
            name: closing
            widget: object
            fields:
              - { label: Eyebrow, name: eyebrow, widget: string }
              - { label: Heading, name: heading, widget: string }
              - { label: Copy, name: copy, widget: text }
  - label: Staff
    name: practitioners
    folder: src/content/practitioners
    create: true
    extension: json
    format: json
    identifier_field: name
    summary: "{{name}} — {{modality}}"
    slug: "{{slug}}"
    fields:
      - { label: Full name, name: name, widget: string }
      - { label: First name, name: shortName, widget: string }
      - { label: Role, name: role, widget: string }
      - { label: Primary modality, name: modality, widget: string }
      - { label: Profile page URL, name: profileUrl, widget: string }
      - { label: Booking URL, name: bookingUrl, widget: string, required: false }
      - { label: Portrait image, name: portrait, widget: image }
      - { label: Portrait alt text, name: portraitAlt, widget: string }
      - { label: Short video URL, name: videoUrl, widget: string, required: false, hint: "Optional. Leave blank to show the portrait instead." }
      - { label: Video poster image, name: videoPoster, widget: image, required: false }
      - { label: Short introduction, name: intro, widget: text }
      - label: Services
        name: services
        widget: select
        multiple: true
        required: false
        options:
          - { label: Osteopathy, value: osteopathy }
          - { label: Physiotherapy, value: physiotherapy }
          - { label: Chiropractic, value: chiropractic }
          - { label: Myotherapy, value: myotherapy }
          - { label: Exercise physiology, value: exercise-physiology }
          - { label: Clinical Pilates, value: clinical-pilates }
          - { label: Strength and conditioning, value: strength-conditioning }
          - { label: Dietetics, value: dietetics }
          - { label: Paediatric osteopathy, value: paediatric-osteopathy }
          - { label: Online consultations, value: online-consults }
      - label: Conditions and clinical interests
        name: conditions
        widget: select
        multiple: true
        required: false
        options:
          - { label: Knee pain, value: knee-pain }
          - { label: Back pain, value: back-pain }
          - { label: Neck pain, value: neck-pain }
          - { label: Headaches, value: headaches }
          - { label: Shoulder pain, value: shoulder-pain }
          - { label: Hip pain, value: hip-pain }
          - { label: Foot pain and plantar fasciitis, value: foot-pain-plantar-fasciitis }
          - { label: TMJ and jaw pain, value: tmj-jaw-pain }
          - { label: Running injuries, value: running-injuries }
          - { label: Sports injuries, value: sports-injuries }
          - { label: Pregnancy-related pain, value: pregnancy-pain }
          - { label: Hypermobility, value: hypermobility }
      - label: Locations
        name: locations
        widget: select
        multiple: true
        required: false
        options:
          - { label: Ascot Vale, value: ascot-vale }
          - { label: Newport, value: newport }
          - { label: Bacchus Marsh, value: bacchus-marsh }
          - { label: Hawthorn, value: hawthorn }
          - { label: Online, value: online }
      - { label: Feature on linked pages, name: featureOnLinkedPages, widget: boolean, default: true }
      - { label: Feature priority, name: featurePriority, widget: number, value_type: int, min: 1, max: 100, default: 50, hint: "Lower numbers appear first when more than one practitioner matches." }
  - label: Services
    name: services_pages
    files:
      - { label: Osteopathy, name: osteopathy_copy, file: content/osteopathy.md, fields: [{ label: Body, name: body, widget: markdown }] }
  - label: Locations
    name: location_pages
    files:
      - { label: Newport, name: newport_copy, file: content/newport.md, fields: [{ label: Body, name: body, widget: markdown }] }
  - label: Conditions
    name: condition_pages
    files:
      - { label: Knee pain, name: knee_pain_copy, file: content/knee-pain.md, fields: [{ label: Body, name: body, widget: markdown }] }
