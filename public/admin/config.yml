# Production login requires a dedicated GitHub OAuth provider. Local editing works
# immediately with `npx decap-server` alongside `npm run dev`.
backend:
  name: github
  repo: lhmorg/alpha-sports-med-website
  branch: main
  base_url: https://alpha-sports-med-prototype.pages.dev
  auth_endpoint: api/auth
  site_domain: alpha-sports-med-prototype.pages.dev

local_backend: true
publish_mode: editorial_workflow
site_url: https://alpha-sports-med-prototype.pages.dev
display_url: https://alpha-sports-med-prototype.pages.dev
logo_url: /assets/images/alpha-logo-lockup.webp

media_folder: public/assets/images/uploads
public_folder: /assets/images/uploads

collections:
  - label: Core Pages
    name: core_pages
    format: json
    extension: json
    files:
      - label: Home
        name: home
        file: src/data/home.json
        fields:
          - label: SEO
            name: seo
            widget: object
            fields:
              - { label: Page title, name: title, widget: string }
              - { label: Meta description, name: description, widget: text }
          - label: Contact and booking
            name: site
            widget: object
            fields:
              - { label: Phone number, name: phoneDisplay, widget: string }
              - { label: Phone link, name: phoneHref, widget: string }
              - { label: Booking URL, name: bookingUrl, widget: string }
          - label: Hero
            name: hero
            widget: object
            fields:
              - { label: Eyebrow, name: eyebrow, widget: string }
              - { label: Heading, name: heading, widget: string }
              - { label: Intro, name: subheading, widget: text }
              - { label: Practitioner image, name: image, widget: image }
              - { label: Image alt text, name: imageAlt, widget: string }
              - { label: Caption name, name: captionName, widget: string }
              - { label: Caption title, name: captionTitle, widget: string }
          - label: Closing call to action
            name: closing
            widget: object
            fields:
              - { label: Eyebrow, name: eyebrow, widget: string }
              - { label: Heading, name: heading, widget: string }
              - { label: Copy, name: copy, widget: text }
      - label: About
        name: about
        file: src/data/about.json
        fields:
          - label: SEO
            name: seo
            widget: object
            fields:
              - { label: Page title, name: title, widget: string }
              - { label: Meta description, name: description, widget: text }
          - label: Hero
            name: hero
            widget: object
            fields:
              - { label: Eyebrow, name: eyebrow, widget: string }
              - { label: Heading, name: heading, widget: string }
              - { label: Intro, name: subheading, widget: text }
          - label: Overview
            name: overview
            widget: object
            fields:
              - { label: Eyebrow, name: eyebrow, widget: string }
              - { label: Heading, name: heading, widget: string }
              - { label: Paragraphs, name: paragraphs, widget: list, field: { label: Paragraph, name: paragraph, widget: text } }
          - label: Values
            name: values
            widget: list
            fields:
              - { label: Icon class, name: icon, widget: string }
              - { label: Title, name: title, widget: string }
              - { label: Copy, name: copy, widget: text }
          - label: How we work
            name: approach
            widget: list
            fields:
              - { label: Number, name: number, widget: string }
              - { label: Title, name: title, widget: string }
              - { label: Copy, name: copy, widget: text }
          - label: Leadership
            name: leadership
            widget: object
            fields:
              - { label: Heading, name: heading, widget: string }
              - { label: Copy, name: copy, widget: text }
          - label: Closing call to action
            name: closing
            widget: object
