  - label: Staff
    name: practitioners
    folder: src/content/practitioners
    create: true
    extension: json
    format: json
    identifier_field: name
    summary: "{{name}} — {{modality}}"
    slug: "{{slug}}"
    fields:
      - { label: Full name, name: name, widget: string }
      - { label: First name, name: shortName, widget: string }
      - { label: Role, name: role, widget: string }
      - { label: Primary modality, name: modality, widget: string }
      - { label: Profile page URL, name: profileUrl, widget: string }
      - { label: Booking URL, name: bookingUrl, widget: string, required: false }
      - { label: Portrait image, name: portrait, widget: image }
      - { label: Portrait alt text, name: portraitAlt, widget: string }
      - { label: Short video URL, name: videoUrl, widget: string, required: false, hint: "Optional. Leave blank to show the portrait instead." }
      - { label: Video poster image, name: videoPoster, widget: image, required: false }
      - { label: Short introduction, name: intro, widget: text }
