name: Deploy prototype to Cloudflare Pages

# Deploys the homepage prototype to the existing Cloudflare Pages project
# (alpha-sports-med-prototype) on every push to main that touches the prototype.
# Keeps the live URL: https://alpha-sports-med-prototype.pages.dev
#
# Required repo secrets (Settings → Secrets and variables → Actions):
#   CLOUDFLARE_API_TOKEN   – a Cloudflare API token with the "Cloudflare Pages: Edit" permission
#   CLOUDFLARE_ACCOUNT_ID  – f46b2cfbf6251ada76c6ae58c9c49a64

on:
  push:
    branches: [main]
    paths:
      - 'design/prototype/homepage/**'
      - '.github/workflows/deploy.yml'
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      deployments: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Deploy to Cloudflare Pages
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          command: pages deploy design/prototype/homepage --project-name=alpha-sports-med-prototype --branch=main
